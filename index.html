<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub 热榜</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>GitHub 热榜</h1>
      <p class="subtitle">日榜 · 周榜 · 涨星最快 · 热点，附领域分类标签</p>
      <p class="updated" id="updated">加载中…</p>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="filters wrap">
    <input type="search" id="search" placeholder="搜索项目…" aria-label="搜索项目" />
    <select id="language" aria-label="按语言筛选"><option value="">全部语言</option></select>
    <div class="chips" id="chips"></div>
  </div>

  <main class="wrap" id="list"></main>

  <footer class="wrap">
    <p>数据由 GitHub Actions 每天自动更新 · 分类标签基于 topics / language 规则映射</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
